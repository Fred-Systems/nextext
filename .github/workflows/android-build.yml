name: Build NexText Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Initialize Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Compile Production Web Interface Layout
        run: |
          npm run build

      - name: Rebuild Android Native Framework from Scratch
        run: |
          rm -rf android/
          npx cap add android
          npx cap sync android

      - name: Grant Gradle Execution Permissions
        run: |
          chmod +x android/gradlew

      - name: Compile Production NexText APK Package
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact to Browser
        uses: actions/upload-artifact@v4
        with:
          name: NexText-Smartphone-Installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
