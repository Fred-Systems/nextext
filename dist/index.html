<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nextext</title>
    <style>html,body,#root{background:#0B141A !important;margin:0;padding:0;height:100%;}</style>
    <script>
    window.__nxCapturedErrors = [];
    window.nxFail = function(msg) {
      window.__nxCapturedErrors.push('FAIL: ' + msg);
    };
    window.addEventListener('error', function(e) {
      window.__nxCapturedErrors.push('ERROR: ' + (e.message||'?') + ' | ' + (e.filename||'?') + ':' + (e.lineno||'?') + ':' + (e.colno||'?') + ' | ' + ((e.error&&e.error.stack)||'no stack'));
    });
    window.addEventListener('unhandledrejection', function(e) {
      var r = e.reason || {};
      window.__nxCapturedErrors.push('REJECT: ' + (r.message || String(r)) + ' | ' + (r.stack || 'no stack'));
    });
    </script>
    <script defer src="./assets/index-DewbeiNl.js"></script>
  </head>
  <body style="margin:0;background:#0B141A;">
    <div id="nx-boot-error" style="position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:auto;display:none;"></div>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0B141A;">
        <img src="./assets/icon-Dws0s15z.png" alt="" style="width:120px;height:120px;object-fit:contain;margin-bottom:24px;" onerror="this.style.display='none'" />
        <div data-nx-splash="1" style="width:30px;height:30px;border:3px solid rgba(16,185,129,0.25);border-top-color:#10B981;border-radius:50%;animation:nxspin 0.9s linear infinite;"></div>
        <div style="color:#8696A0;font-size:13px;margin-top:16px;">Loading…</div>
        <style>@keyframes nxspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;z-index:99999999;background:#FF3B30;color:#fff;display:flex;align-items:center;justify-content:center;font:bold 18px sans-serif;text-align:center;padding:32px;">
        JavaScript is disabled. NexText requires JavaScript to run.
      </div>
    </noscript>
    <script>
    var NX_VER = 'iife-v2';
    var nxBootStart = Date.now();

    var nxBticker = document.createElement('div');
    nxBticker.id = 'nx-boot-ticker';
    nxBticker.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999999;background:rgba(255,0,0,0.9);color:#fff;font:bold 14px monospace;padding:8px 12px;text-align:center;letter-spacing:1px;';
    nxBticker.textContent = 'v' + NX_VER + ' BOOT 0s';
    document.body.appendChild(nxBticker);

    setInterval(function(){
      var s = Math.round((Date.now()-nxBootStart)/1000);
      var root = document.getElementById('root');
      var kids = root ? root.children.length : -1;
      var splash = !!document.querySelector('[data-nx-splash]');
      nxBticker.textContent = 'v' + NX_VER + ' ' + s + 's root:' + kids + ' splash:' + splash;
    }, 500);

    fetch('./assets/' + (function(){var s=document.querySelectorAll('script[src]');return s.length>0?s[s.length-1].getAttribute('src').split('/').pop():'unknown'})(), {method:'HEAD'}).then(function(r) {
      window.__nxBundleStatus = r.status;
      if (!r.ok) window.__nxCapturedErrors.push('FETCH: bundle HEAD returned ' + r.status);
      else window.__nxBundleExists = true;
    }).catch(function(e) {
      window.__nxCapturedErrors.push('FETCH ERR: ' + e.message);
    });

    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.querySelector('[data-nx-splash]')) {
        var errCount = window.__nxCapturedErrors.length;
        var errText = errCount > 0 ? window.__nxCapturedErrors.join('\n---\n') : '(none)';
        var el = document.getElementById('nx-boot-error');
        if (el) {
          el.style.display = 'block';
          el.style.pointerEvents = 'auto';
          el.innerHTML = '<pre style="color:#ff6b6b;padding:16px;font-size:11px;white-space:pre-wrap;word-break:break-all;background:#0B141A;min-height:100vh;">' +
            'v' + NX_VER + ' | Boot timeout (12s)\n' +
            'bundle fetch: ' + (window.__nxBundleStatus||'?') + ' exists=' + (window.__nxBundleExists||false) + '\n' +
            'errors (' + errCount + '):\n' + errText + '</pre>';
        }
      }
    }, 12000);
    </script>
  </body>
</html>
