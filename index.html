<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nextext</title>
    <style>html,body,#root{background:#0B141A !important;margin:0;padding:0;height:100%;}</style>
    <script>
    /* #nx-boot-error is OUTSIDE #root so React can never overwrite it.
       addEventListener('error') catches module script errors;
       window.onerror does NOT. */
    function showBootError(html) {
      var el = document.getElementById('nx-boot-error');
      if (el) { el.style.display = 'block'; el.style.pointerEvents = 'auto'; el.innerHTML = html; }
    }
    window.addEventListener('error', function(e) {
      showBootError('<pre style="color:#ff6b6b;padding:16px;font-size:11px;white-space:pre-wrap;word-break:break-all;background:#0B141A;min-height:100vh;">' + (e.message||'Error') + '\n' + (e.filename||'') + ':' + (e.lineno||'') + '\n' + ((e.error&&e.error.stack)||'') + '</pre>');
    });
    window.addEventListener('unhandledrejection', function(e) {
      showBootError('<pre style="color:#ff6b6b;padding:16px;font-size:11px;white-space:pre-wrap;word-break:break-all;background:#0B141A;min-height:100vh;">Unhandled: ' + (e.reason && e.reason.stack || e.reason) + '</pre>');
    });
    /* Safety: if nothing renders after 12s, show a diagnostic message */
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.children.length <= 1) {
        showBootError('<pre style="color:#ff6b6b;padding:16px;font-size:11px;white-space:pre-wrap;word-break:break-all;background:#0B141A;min-height:100vh;">Boot timed out (12s). JavaScript may have crashed.\nRoot innerHTML length: ' + (root.innerHTML||'').length + '\nCheck Android Logcat for errors.</pre>');
      }
    }, 12000);
    </script>
  </head>
  <body style="margin:0;background:#0B141A;">
    <div id="nx-boot-error" style="position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:auto;display:none;"></div>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0B141A;">
        <img src="./icon.png" alt="" style="width:120px;height:120px;object-fit:contain;margin-bottom:24px;" onerror="this.style.display='none'" />
        <div style="width:30px;height:30px;border:3px solid rgba(16,185,129,0.25);border-top-color:#10B981;border-radius:50%;animation:nxspin 0.9s linear infinite;"></div>
        <div style="color:#8696A0;font-size:13px;margin-top:16px;">Loading…</div>
        <style>@keyframes nxspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
